name: Render Video
run-name: "Render ${{ inputs.job_id }}"

on:
  workflow_dispatch:
    inputs:
      job_id:       { description: "Job id (sent by the app)", required: true,  type: string }
      script:       { description: "Video script",            required: true,  type: string }
      voice_engine: { description: "auto | edge | eleven | gemini", required: false, type: string, default: "auto" }
      voice:        { description: "Edge-TTS voice name",      required: false, type: string, default: "en-GB-RyanNeural" }
      style:        { description: "vintage | clean",          required: false, type: string, default: "vintage" }
      subtitles:    { description: "true | false",             required: false, type: string, default: "true" }
      visuals:      { description: "auto | ai | real",         required: false, type: string, default: "auto" }
      resolution:   { description: "1080p | 720p",             required: false, type: string, default: "1080p" }
      image_prompts: { description: "Optional: one line per sentence, comma-separate for several images in one sentence", required: false, type: string, default: "" }

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GEMINI_API_KEY:      ${{ secrets.GEMINI_API_KEY }}
      ELEVENLABS_API_KEY:  ${{ secrets.ELEVENLABS_API_KEY }}
      ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
      GEMINI_TTS_VOICE:    ${{ secrets.GEMINI_TTS_VOICE }}
      PEXELS_API_KEY:      ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY:     ${{ secrets.PIXABAY_API_KEY }}
      GOOGLE_CSE_KEY:      ${{ secrets.GOOGLE_CSE_KEY }}
      GOOGLE_CSE_ID:       ${{ secrets.GOOGLE_CSE_ID }}
      POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
      SCRIPT_TEXT:  ${{ inputs.script }
