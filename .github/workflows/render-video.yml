name: Render Video
run-name: "Render ${{ inputs.job_id }}"

on:
  workflow_dispatch:
    inputs:
      job_id:       { description: "Job id (sent by the app)", required: true,  type: string }
      script:       { description: "Video script",            required: true,  type: string }
      voice_engine: { description: "auto | edge | eleven | gemini", required: false, type: string, default: "auto" }
      voice:        { description: "Edge-TTS voice name",      required: false, type: string, default: "en-GB-RyanNeural" }
      style:        { description: "vintage | clean",          required: false, type: string, default: "vintage" }
      subtitles:    { description: "true | false",             required: false, type: string, default: "true" }
      visuals:      { description: "auto | ai | real",         required: false, type: string, default: "auto" }
      resolution:   { description: "1080p | 720p",             required: false, type: string, default: "1080p" }
      image_prompts: { description: "Optional: one line per sentence, comma-separate for several images in one sentence", required: false, type: string, default: "" }

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GEMINI_API_KEY:      ${{ secrets.GEMINI_API_KEY }}
      ELEVENLABS_API_KEY:  ${{ secrets.ELEVENLABS_API_KEY }}
      ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
      GEMINI_TTS_VOICE:    ${{ secrets.GEMINI_TTS_VOICE }}
      PEXELS_API_KEY:      ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY:     ${{ secrets.PIXABAY_API_KEY }}
      GOOGLE_CSE_KEY:      ${{ secrets.GOOGLE_CSE_KEY }}
      GOOGLE_CSE_ID:       ${{ secrets.GOOGLE_CSE_ID }}
      POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
      SCRIPT_TEXT:  ${{ inputs.script }}
      VOICE:        ${{ inputs.voice }}
      VOICE_ENGINE: ${{ inputs.voice_engine }}
      STYLE:        ${{ inputs.style }}
      SUBS:         ${{ inputs.subtitles }}
      VISUALS:      ${{ inputs.visuals }}
      RESOLUTION:   ${{ inputs.resolution }}
      IMAGE_PROMPTS: ${{ inputs.image_prompts }}
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install requests edge-tts
          mkdir -p work out
          printf '%s' "$SCRIPT_TEXT" > work/script.txt
          printf '%s' "$IMAGE_PROMPTS" > work/image_prompts.txt

      - name: "1/5 Plan scenes"
        run: python pipeline/make_video.py --stage plan

      - name: "2/5 Write titles, description, hashtags, thumbnail"
        run: python pipeline/make_video.py --stage metadata --resolution "$RESOLUTION"

      - name: "3/5 Narration voice"
        run: python pipeline/make_video.py --stage voice --voice "$VOICE" --voice-engine "$VOICE_ENGINE"

      - name: "4/5 Find visuals"
        run: python pipeline/make_video.py --stage visuals --visuals "$VISUALS"

      - name: "5/5 Render video"
        run: python pipeline/make_video.py --stage render --style "$STYLE" --subtitles "$SUBS" --resolution "$RESOLUTION"

      - name: Publish video
        env:
          GH_TOKEN: ${{ github.token }}
          JOB: ${{ inputs.job_id }}
        run: |
          assets="out/final.mp4 out/credits.txt out/subtitles.srt out/scene_plan.json out/youtube_metadata.txt"
          [ -f out/thumbnail.jpg ] && assets="$assets out/thumbnail.jpg"
          gh release create "video-$JOB" $assets \
            --title "Video $JOB" --notes "Rendered automatically." --target "$GITHUB_SHA"
          # keep only the 8 newest videos so storage stays small
          gh release list --limit 100 --json tagName --jq '.[].tagName' | grep '^video-' | tail -n +9 \
            | xargs -r -I{} gh release delete {} --cleanup-tag -y
